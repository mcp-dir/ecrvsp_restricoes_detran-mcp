# Smithery configuration for ECRVSP Restrições: Bloqueios Ativos DETRAN
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_ecrvsp_restricoes_detran

name: ecrvsp_restricoes_detran-mcp
displayName: "ECRVSP Restrições: Bloqueios Ativos DETRAN"
description: >
  ECRVSP Restrições: Bloqueios Ativos DETRAN, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/ecrvsp_restricoes_detran-mcp
repository: https://github.com/mcp-dir/ecrvsp_restricoes_detran-mcp

tags:
  - ecrvsp_restricoes_detran
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_ecrvsp_restricoes_detran

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_ecrvsp_restricoes_detran/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
